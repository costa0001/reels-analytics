<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аналитика Reels</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6fc;--card:#fff;--ink:#14213d;--mut:#5f6b80;--line:#dde6f1;--acc:#0b2a5b;--accbg:#e3ecf8;--hl:#fff3a8;--warn:#eaf2fc;--warnink:#0b2a5b;--btn:#0b2a5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(241,246,252,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:18px;height:56px}.brand{font-weight:800;letter-spacing:-.02em;font-size:17px}
nav{display:flex;gap:4px}nav a{padding:7px 13px;border-radius:999px;color:var(--mut);text-decoration:none;font-weight:600}
nav a.on{background:var(--btn);color:#fff}
h1{font-size:30px;letter-spacing:-.03em;margin:28px 0 4px;font-weight:800}h2{font-size:20px;margin:30px 0 12px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 18px;max-width:700px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.exp{cursor:pointer;transition:.15s}.exp:hover{border-color:#0b2a5b}
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#dbe7f6 center/cover no-repeat;color:var(--btn);font-weight:700;overflow:hidden;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.avrow{display:flex;align-items:center;gap:10px}
.sbtn{border:1px solid var(--btn);background:#fff;color:var(--btn);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.sbtn:hover{background:#e9f1fb}
.go{background:var(--btn);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.go:disabled{opacity:.5}
.modal{position:fixed;inset:0;background:rgba(11,42,91,.35);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 12px}
.mbox{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.x{cursor:pointer;font-size:18px;color:var(--mut)}
.refbox{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.form label{display:block;font-size:13px;color:var(--mut);margin:8px 0}.form input,.form select{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:inherit;box-sizing:border-box}
.row3{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}.warnbox{background:var(--warn);border:1px solid #c9daf0;border-radius:10px;padding:10px 12px}
.hk li{margin:4px 0}.scr p{margin:6px 0}.sbg{display:grid;gap:10px}.sl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slh{display:flex;gap:10px;align-items:center;background:var(--bg);padding:6px 10px;font-size:13px}.slb{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px;font-size:14px}
.frame{aspect-ratio:9/16;background:#0b2a5b;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:13px;line-height:1.25}
@media(max-width:640px){.row3{grid-template-columns:1fr}.slb{grid-template-columns:90px 1fr}}
.slmodal{position:fixed;inset:0;background:#f1f6fc;z-index:60;display:flex;flex-direction:column}
.sltop{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:#fff}
.slbody{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:18px}
.slide{display:grid;grid-template-columns:minmax(200px,300px) minmax(260px,520px);gap:24px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;max-width:900px;width:100%}
.frame.big{position:relative;aspect-ratio:9/16;background:linear-gradient(160deg,#16386f,#0b2a5b);border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center}
.fshot{position:absolute;top:10px;left:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:999px}
.ftxt{font-weight:800;font-size:20px;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.fvis{position:absolute;bottom:10px;left:10px;right:10px;font-size:11px;opacity:.75;line-height:1.3}
.snote h2{margin:4px 0 6px}.voice{font-size:17px;line-height:1.45;background:var(--bg);border-radius:10px;padding:10px 12px}
.slnav{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px;border-top:1px solid var(--line);background:#fff}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#c9daf0;cursor:pointer}.dots i.on{background:var(--btn)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.pn{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;font-size:13px;line-height:1.35}
.pnh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.pnh b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--btn);color:#fff;align-items:center;justify-content:center;font-size:12px}.pnh span{color:var(--mut);font-size:12px}
svg.sk{display:block;width:100%;height:auto;aspect-ratio:9/16;border-radius:10px}.pnv{margin-top:6px;font-weight:600}.pnx{margin-top:3px;color:var(--mut);font-size:12px}
.skwrap{position:relative}.skwrap .fshot{top:10px;left:10px;background:rgba(45,45,45,.8);color:#fff;z-index:2}
.scn{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#fff}.scnh{margin-bottom:8px}.scnh .pnv{font-weight:500;margin-top:4px}
.frs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.frs.mini{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}.fr{cursor:pointer}.fr svg.sk{border-radius:8px}.fra{font-size:11px;color:var(--mut);line-height:1.25;margin-top:3px}
.anbar{height:6px;background:#e3ebf6;border-radius:4px;margin-top:14px;overflow:hidden}.anbar i{display:block;height:100%;background:var(--btn)}
.tprompt{background:#fffdf3;border:1px solid #efe3b5;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5}.tprompt p{margin:6px 0}.tprompt .counts{font-size:12px}
.revbox{background:#f4f7fc;border:1px solid #d6e2f3;border-radius:12px;padding:12px 14px;margin:10px 0}.revbox textarea,.form textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical;margin-top:4px}
.psheet{display:none}
#printarea{display:none}
@media print{body.printing>*:not(#printarea){display:none!important}body.printing #printarea{display:block}.pslide{page-break-after:always;padding:10px}.pslide .slide{border:0;grid-template-columns:240px 1fr}.pn{break-inside:avoid}body.printing .psheet{display:block}.psheet .frs{grid-template-columns:repeat(6,1fr)}.psheet .fr{break-inside:avoid}}
@media(max-width:640px){.slide{grid-template-columns:1fr}.frame.big,.skwrap{max-width:240px;margin:0 auto;width:100%}}
.exp h3{margin:0;font-size:17px}.handle{color:var(--mut);font-size:13px}
.stats{display:flex;gap:16px;margin:12px 0 0;flex-wrap:wrap}.stat b{display:block;font-size:17px}.stat span{font-size:11.5px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0}
.box h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.lesson{background:var(--warn);border-color:#c9daf0}
.reel{display:grid;grid-template-columns:46px 1fr;gap:12px}
.rank{font-weight:800;font-size:22px;color:#b7c6dc}.rt{font-weight:700;font-size:16px;margin:0}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:4px 0 8px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#eef2f8;color:#3f4a5e;margin:0 4px 4px 0}
.pill.g{background:var(--accbg);color:var(--acc)}.pill.hot{background:#0b2a5b;color:#fff;font-weight:600}
.hook{background:var(--hl);padding:2px 4px;font-weight:600}
details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:13px;margin-top:6px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:12px 0 2px;font-weight:600}
.tr{font-size:13px;color:#3a4458;background:#f6f9fd;border-radius:8px;padding:10px;max-height:240px;overflow:auto}
a.ext{color:var(--acc);font-size:12.5px;font-weight:600;text-decoration:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.core h3{margin:0 0 4px;font-size:17px}.core p{margin:6px 0}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.btns button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btns button.on.no{background:#7d8aa3;border-color:#7d8aa3}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;min-height:38px;resize:vertical;background:#fbfdff}
.saved{font-size:12px;color:var(--acc);height:16px}
.note{font-size:12.5px;color:var(--mut);margin:30px 0 40px}
.back{color:var(--mut);cursor:pointer;font-weight:600;font-size:13px;margin-top:18px;display:inline-block}
.counts{font-size:13px;color:var(--mut)}
@media(max-width:600px){h1{font-size:24px}.reel{grid-template-columns:1fr}.rank{font-size:16px}}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:#f6f9fd;cursor:pointer;white-space:nowrap}
td .h{color:var(--mut);font-size:12px}.num{white-space:nowrap;font-weight:600}
.done{display:inline-block;white-space:nowrap;background:var(--btn);color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;text-decoration:none}
input.s{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;min-width:220px}
.flab{font-size:12px;color:var(--mut);align-self:center;margin-right:2px;font-weight:600}
@media(max-width:700px){.hide-m{display:none}}
</style></head><body>
<header><div class="wrap top"><div class="brand">Аналитика Reels</div><nav><a href="#blogery" id="n0">Блогеры</a><a href="#razbory" id="n1">Разборы</a><a href="#yadra" id="n2">Библиотека ядер</a><a href="#scen" id="n3">Сценарии</a></nav></div></header>
<main class="wrap" id="app"></main>

<script>
function av(hd,nm,s){s=s||36;const L=esc(((nm||hd||'?').trim()[0]||'?').toUpperCase());return`<span class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px;background-image:${window._AV&&window._AV[hd]?`url(${window._AV[hd]})`:`url('avatars/${encodeURIComponent(hd)}.jpg')`}"></span>`}
let D,B,analyzed,bmap;
try{const m=JSON.parse(localStorage.getItem('reels_marks')||'{}');if(m&&typeof m==='object')Object.assign(window,{_lm:m})}catch(e){}
function prep(){
analyzed=new Set(D.experts.map(e=>e.handle.toLowerCase()));
bmap=Object.fromEntries(B.map(b=>[b.handle.toLowerCase(),b]));
D.experts.forEach(e=>{const b=bmap[e.handle.toLowerCase()];e.lang=b?(b.market==='EN'?'en':b.market==='UA'?'ua':'ru'):'en';e.subs_text=b?b.subs_text:''});
D.experts.forEach(e=>{e.median=med(e.reels.map(r=>r.plays));e.reels.forEach(r=>{r.expert=e.name;r.handle=e.handle;r.x=r.plays/e.median;r.cpm=(r.comments||0)/r.plays*1000})});
}




const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' млн':n>=1e3?Math.round(n/1e3)+' тыс':String(n);
const ok=s=>s&&s.trim()&&s.trim()!=='—';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const med=a=>{const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};

let marks=(window._lm||{}),db=null,uid=null,cur={expert:null,filt:'all',lang:'all',verdict:'all'};
const V=[['take','Беру'],['notmine','Ядро, но не моё'],['notcore','Не ядро'],['done','Уже снимал']];
const app=document.getElementById('app');
function route(){const h=location.hash.slice(1)||'blogery';document.getElementById('n0').className=h==='blogery'?'on':'';document.getElementById('n1').className=h==='razbory'||h.startsWith('e-')?'on':'';document.getElementById('n2').className=h==='yadra'?'on':'';document.getElementById('n3').className=h==='scen'?'on':'';
 if(h==='scen')return renderScripts();
 if(h==='yadra')return renderCores(); const m=h.match(/^e-([\w.-]+)/); if(m)return renderExpert(m[1]); if(h==='razbory'){renderHome();return window.scrollTo(0,0)} renderBloggers()}
let bf={lang:'all',subs:'all',q:'',sort:'n'};
const LANG=[['all','Все'],['ru','Русскоязычные'],['ua','Украиноязычные'],['en','Англоязычные']];
const SUBS=[['all','Любое'],['0','до 100 тыс'],['1','100–500 тыс'],['2','500 тыс – 1 млн'],['3','1–5 млн'],['4','5 млн+']];
const subsBand=n=>n==null?-1:n<1e5?0:n<5e5?1:n<1e6?2:n<5e6?3:4;
const langOf=b=>b.market==='EN'?'en':b.market==='UA'?'ua':'ru';
function renderBloggers(){
 let L=B.filter(b=>bf.lang==='all'||langOf(b)===bf.lang).filter(b=>bf.subs==='all'||subsBand(b.subs)===+bf.subs);
 if(bf.q){const q=bf.q.toLowerCase();L=L.filter(b=>(b.name+' '+b.handle+' '+b.niche+' '+b.sells).toLowerCase().includes(q))}
 if(bf.sort==='subs')L=[...L].sort((a,b)=>(b.subs||0)-(a.subs||0));
 const cnt=k=>B.filter(b=>k==='all'||langOf(b)===k).length;
 app.innerHTML=`<h1>Блогеры для анализа</h1><p class="sub">${B.length} аккаунтов: ${cnt('ru')} русскоязычных, ${cnt('ua')} украиноязычных, ${cnt('en')} англоязычных. Зелёная отметка — разбор рилсов уже готов.</p>
 <div class="filters"><span class="flab">Язык:</span>${LANG.map(([k,l])=>`<button class="chip ${bf.lang===k?'on':''}" data-l="${k}">${l} · ${cnt(k)}</button>`).join('')}</div>
 <div class="filters"><span class="flab">Подписчики:</span>${SUBS.map(([k,l])=>`<button class="chip ${bf.subs===k?'on':''}" data-s="${k}">${l}</button>`).join('')}</div>
 <div class="filters"><input class="s" id="q" placeholder="Поиск по имени, нику, нише" value="${esc(bf.q)}"><span class="flab" style="margin-left:8px">Сортировка:</span><button class="chip ${bf.sort==='n'?'on':''}" data-o="n">как в списке</button><button class="chip ${bf.sort==='subs'?'on':''}" data-o="subs">по подписчикам</button><span class="counts" style="align-self:center">Найдено: ${L.length}</span></div>
 <table><thead><tr><th style="width:44px">№</th><th>Блогер</th><th style="width:92px">Подписчики</th><th class="hide-m">Ниша</th><th class="hide-m">Что продаёт</th><th style="width:96px">Разбор</th></tr></thead><tbody>
 ${L.map(b=>{const has=analyzed.has(b.handle.toLowerCase());return`<tr><td class="h">${b.market} ${b.n}</td><td><div class="avrow">${av(b.handle,b.name,38)}<div><b>${esc(b.name)}</b><br><a class="ext" href="${esc(b.url)}" target="_blank" rel="noopener">@${esc(b.handle)}</a> <span class="h">${b.platform!=='Instagram'?esc(b.platform):''}</span></div></div></td><td class="num">${esc(b.subs_text)}</td><td class="hide-m">${esc(b.niche)}<br><span class="h">${b.close==='прямая'?'прямая ниша':'смежная ниша'}</span></td><td class="hide-m h">${esc(b.sells)}</td><td>${has?`<a class="done" href="#e-${esc(b.handle)}">готов →</a>`:'<span class="h">—</span>'}</td></tr>`}).join('')}
 </tbody></table><p class="note">Подписчики — из твоей таблицы (у англоязычных часто диапазон; фильтр берёт нижнюю границу).</p>`;
 app.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{bf.lang=x.dataset.l;renderBloggers()});
 app.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{bf.subs=x.dataset.s;renderBloggers()});
 app.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{bf.sort=x.dataset.o;renderBloggers()});
 const q=document.getElementById('q');q.oninput=()=>{bf.q=q.value;const p=q.selectionStart;renderBloggers();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
}
function card(e){{const top=[...e.reels].sort((a,b)=>b.plays-a.plays)[0];const hits=e.reels.filter(r=>r.x>=2).length;return`<div class="card exp" onclick="location.hash='e-${e.handle}'"><div class="avrow">${av(e.handle,e.name,52)}<div><h3>${esc(e.name)}</h3><div class="handle">@${e.handle} · ${esc(e.subs_text)} подп. · ${esc(e.sample)}</div></div></div><p style="margin:10px 0 0;font-size:13.5px">${esc(e.about)}</p><div class="stats"><div class="stat"><b>${fmt(e.median)}</b><span>медиана просмотров</span></div><div class="stat"><b>${hits} из ${e.reels.length}</b><span>залётов (×2 к медиане)</span></div><div class="stat"><b>${fmt(top.plays)}</b><span>лучший рилс</span></div></div></div>`}}
function renderHome(){const g=(l,t)=>{const L=D.experts.filter(e=>e.lang===l);return L.length?`<h2>${t} · ${L.length}</h2><div class="grid">${L.map(card).join('')}</div>`:''};app.innerHTML=`<h1>Разборы</h1><p class="sub">Эксперты, их рилсы в Instagram и разбор: что залетает, почему и какое ядро можно забрать себе.</p>${g('ru','Русскоязычные')}${g('ua','Украиноязычные')}${g('en','Англоязычные')}<p class="note">Цифры — публичные данные Instagram на 20.11.2026. «×» — во сколько раз рилс выше медианы выборки (у топ-10 сравнение внутри десятки). Тексты расшифрованы из звука автоматически, возможны неточности.</p>`}
function reelCard(r,i){const hot=r.x>=2?`<span class="pill hot">×${r.x.toFixed(1)} к медиане</span>`:`<span class="pill">×${r.x.toFixed(1)}</span>`;
 return`<div class="box reel"><div class="rank">№${i+1}</div><div><p class="rt">${esc(r.title)}</p><div class="meta"><span><b>${fmt(r.plays)}</b> просм.</span><span>${r.likes<50&&r.plays>1e5?'лайки скрыты':fmt(r.likes)+' лайков'}</span><span>${fmt(r.comments||0)} комм.</span><span>${r.dur} с</span><span>${r.date}</span></div>${hot}<span class="pill">${esc(r.format)}</span>${r.tags.map(t=>`<span class="pill g">${esc(t)}</span>`).join('')}
 <div class="lbl">Хук</div><div><span class="hook">${esc(r.hook_ru)}</span></div>${r.hook_en?`<div style="font-size:12.5px;color:var(--mut);margin-top:3px">Оригинал: «${esc(r.hook_en)}»</div>`:''}

function scPrompt(r,e,p){return `Ты — сценарист коротких вертикальных видео (Instagram Reels) и монтажёр. Пиши по-русски.
ЗАДАЧА: на основе вирусного ролика-референса создать НОВЫЙ оригинальный сценарий для автора, сохранив смысловое ядро (почему ролик сработал), но в его теме. Не копируй текст референса дословно — перенеси механику.

РЕФЕРЕНС
Автор: ${e.name} (@${e.handle}); просмотры: ${r.plays}; комментарии: ${r.comments||0}; длительность: ${r.dur} c
Формат: ${r.format}
Хук: ${r.hook_ru}
${ok(r.core)?'Ядро: '+r.core+(ok(r.core_text)?' — '+r.core_text:''):''}
${ok(r.why)?'Почему сработал: '+r.why:''}
${ok(r.adapt)?'Подсказка по адаптации: '+r.adapt:''}
${r.transcript?'Текст ролика (начало, автоматическая расшифровка, могут быть ошибки): '+r.transcript.slice(0,1500):''}
${r.caption?'Подпись: '+r.caption.slice(0,600):''}

АВТОР НОВОГО РОЛИКА (главное: сценарий пишется для ЭТОГО человека, его голосом и про его дело)
Обо мне: ${p.about||'не указано'}
Тема/ниша: ${p.topic||'не указана — выбери близкую к референсу'}
Что продаёт / куда ведёт: ${p.offer||'не указано'}
Кодовое слово для комментариев: ${p.cw||'придумай короткое'}
Длительность: ${p.dur} секунд
Подача: ${p.tone}
Пожелания: ${p.note||'нет'}

ТРЕБОВАНИЯ
- Пиши только про тему, продукт и аудиторию автора. Тему, нишу и аудиторию референса НЕ переносить — из референса бери только механику (структуру, приём хука, ритм).
- Не выдумывай автору кейсы, цифры, регалии и факты, которых нет в «Обо мне»; где нужен пример — пиши нейтрально или ставь [вставь свой пример].
- Первые 1–3 секунды — сильный хук (боль, интрига, цифра или провокация), понятный без звука по титру.
- Говорить простым разговорным языком, короткими фразами, без воды.
- Одна мысль — один кадр. Темп и длина должны укладываться в ${p.dur} c (≈2,3 слова в секунду речи).
- Финал — призыв написать кодовое слово в комментарии и что человек получит.
- Раскадровка — по сценам (слайдам), с таймкодами, планом, тем, что в кадре, текстом речи, титром на экране и монтажным приёмом.
- Для КАЖДОЙ сцены заполни объект sk (выбери по одному значению из списков) — по нему рисуется скетч кадра: план (CU крупный — лицо, MCU — по грудь, MS — по пояс, WS — в полный рост, SCREEN — запись экрана телефона, HANDS — крупно руки с предметом, OBJECT — предмет/деталь, TEXT — титр на фоне, OTS — через плечо, POV — от первого лица), поза и эмоция автора, фон, предмет, движение камеры, где титр. Чередуй планы: не делай все сцены одинаковыми, вставь 1–2 перебивки (SCREEN / HANDS / OBJECT), если это уместно по смыслу.
- Титр (onscreen) — коротко, до 7 слов.
- ТЕМП МОНТАЖА: один кадр = 0,7 секунды. Таймкоды сцен должны покрывать ровно ${p.dur} с без пропусков (формат «0–2,8 с»). В каждой сцене массив frames, кадров в нём = длительность сцены / 0,7 (округлённо; на весь ролик ≈${Math.round(p.dur/0.7)} кадров). Каждый кадр — новое событие: смена плана (крупный ↔ средний), наезд, жест, перебивка экраном/предметом, смена титра. Не повторяй один и тот же кадр подряд. Слова речи (w) распредели по кадрам по порядку, без пропусков. Поля кадра короткие.

{"title":"рабочее название ролика","idea":"1–2 предложения: какое ядро берём из референса и как переносим","hooks":["вариант хука 1","вариант хука 2","вариант хука 3"],"script":[{"part":"Хук|Боль|Поворот|Польза|Доказательство|Призыв и т.п.","text":"дословно, что говорит автор"}],"storyboard":[{"n":1,"time":"0–3 с","shot":"крупный / средний / экран / B-roll / титр","visual":"что в кадре и что делает автор","voice":"текст за кадром или в кадре","onscreen":"текст на экране","edit":"монтаж: зум, склейка, звук, переход","sk":{"plan":"CU|MCU|MS|WS|SCREEN|HANDS|OBJECT|TEXT|OTS|POV","pose":"talk|point_up|point_side|point_down|show_phone|hold|surprise|think|count|arms_open|walk|sit","emotion":"neutral|smile|serious|surprised|sad","look":"camera|side|down","bg":"plain|room|office|kitchen|street|car|studio|clinic","obj":"none|phone|laptop|paper|cup|product|money|chart|calendar","obj_label":"до 3 слов: что написано на экране/предмете","cam":"static|zoom_in|zoom_out|pan_left|pan_right|handheld|cut","text_pos":"top|center|bottom"},"frames":[{"p":"план CU|MCU|MS|WS|SCREEN|HANDS|OBJECT|TEXT|OTS|POV","po":"поза","e":"эмоция","o":"предмет","ol":"надпись на предмете/экране","c":"cut|zoom_in|zoom_out|pan_left|pan_right|handheld|static","tx":"титр в этом кадре или пусто","w":"слова речи, звучащие в этом кадре (1–3 слова)","a":"что происходит, 2–5 слов"}]}],"cover":"текст обложки (до 6 слов)","caption":"подпись к рилсу 2–4 предложения с призывом","props":"что подготовить к съёмке (одной строкой)"}`}

  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
  parts.push(new Uint8Array(h.buffer),name,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  cent.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length}
 const cs=cent.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cent,new Uint8Array(e.buffer)],{type:'application/zip'})}
function svgToPng(svg,w,h){return new Promise((res)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);c.toBlob(b=>b.arrayBuffer().then(a=>res(new Uint8Array(a))),'image/jpeg',0.92)};img.onerror=()=>res(null);
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="'+w+'" height="'+h+'" '))})}
function srtT(t){const ms=Math.round(t*1000);const h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60,r=ms%1000;const p=(n,l)=>String(n).padStart(l||2,'0');return `${p(h)}:${p(m)}:${p(s)},${p(r,3)}`}

function svgImg(svg){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
function cvWrap(x,t,maxW){const out=[];String(t||'').split('\n').forEach(par=>{let cur='';par.split(/\s+/).filter(Boolean).forEach(w=>{const tt=cur?cur+' '+w:w;if(x.measureText(tt).width>maxW&&cur){out.push(cur);cur=w}else cur=tt});out.push(cur)});return out}
async function buildPDF(rec,onp){const o=rec.out||{},p=rec.params||{};const W=1240,H=1754,M=80;const pages=[];let c,x,y;

  x.font='16px '+FONT;x.fillStyle='#8a8f99';x.fillText((o.title||'Сценарий')+' · стр. '+pages.length,M,H-40);x.fillStyle='#1f2430'};

 text(`${p.dur||''} с · ${scFrames(rec).length} кадров по ${String(FR_SEC).replace('.',',')} с · референс: ${rec.expert||''}${rec.core?' · ядро: '+rec.core:''}`,20,{color:'#6b7280',after:14});
 if(o.idea){head('Идея');text(o.idea,24)}

 for(let k=0;k<F.length;k++){const f=F[k];if(k%(cols*rows)===0){newPage();x.font='700 30px '+FONT;x.fillStyle='#1f2430';x.fillText(`Раскадровка: кадры ${k+1}–${Math.min(F.length,k+cols*rows)} из ${F.length} (по ${String(FR_SEC).replace('.',',')} с)`,M,M+20);y=M+50}
  const i=k%(cols*rows),cx=M+(i%cols)*(cw+gx),cy=y+Math.floor(i/cols)*(ch+18);

  let yy=cy+ih+48;x.font='16px '+FONT;for(const l of cvWrap(x,(f.sub?'«'+f.sub+'»':'')+(f.tx?' Титр: '+f.tx:'')+(f.act?' · '+f.act:''),cw).slice(0,4)){x.fillText(l,cx,yy);yy+=21}

 <textarea id="revt-${rec.id}" rows="4" placeholder="Например: убери тему самозанятых — я работаю с экспертами; хук слишком длинный; не говори про доход; сделай подачу от первого лица; замени пример на стоматологию"></textarea>

${p.about||scPrefs.about||'не указано'}
Тема/ниша: ${p.topic||'—'}; продукт: ${p.offer||'—'}; кодовое слово: ${p.cw||'—'}; длительность: ${p.dur} с; подача: ${p.tone}

${own?'ТЕКСТ АВТОРА (дословно):\n'+own:'ПРАВКИ АВТОРА:\n'+fb}

async function reviseScript(sid,useOwn){const rec=scripts[sid];if(!SC)return;const st=document.getElementById('revs-'+sid);
 const fb=(document.getElementById('revt-'+sid)||{}).value||'';const own=useOwn?(document.getElementById('ownt-'+sid)||{}).value||'':'';
 if(!useOwn&&!fb.trim()){st.textContent='Напиши, что исправить';return}
 st.textContent='Переделываю… обычно 30–60 секунд';
 try{const out=await SC.json(revPrompt(rec,fb.trim(),own.trim()),{modelTier:'complex'});if(!out||!out.storyboard)throw {message:'пустой ответ'};
  rec.versions=(rec.versions||[]).concat([{out:rec.out,at:new Date().toISOString(),fb:useOwn?'свой текст':fb.trim()}]).slice(-5);rec.out=out;rec.edited=new Date().toISOString();
  if(rec._saved)await saveScript(sid);rerenderScript(sid)}
 catch(e){st.textContent=e&&e.code==='rate_limited'?'Слишком много запросов — попробуй через минуту.':'Не получилось: '+(e&&e.message||'ошибка')}}
function undoScript(sid){const rec=scripts[sid];const v=(rec.versions||[]).pop();if(!v)return;rec.out=v.out;if(rec._saved)saveScript(sid);rerenderScript(sid)}
function rerenderScript(sid){const el=document.getElementById('scv-'+sid);if(!el)return;const fresh=el.dataset.fresh==='1';el.outerHTML=scriptView(scripts[sid],fresh)}

// ===== Раскадровка слайдами + печать =====
let SL={id:null,i:0};
function slideHTML(rec,i){const o=rec.out||{},sb=o.storyboard||[],n=sb.length+2;
 if(i===0)return `<div class="slide cover"><div class="skwrap"><div class="fshot">ОБЛОЖКА</div>${sketchSVG({sk:Object.assign({},(sb[0]||{}).sk||{},{plan:'MCU',cam:'static'}),visual:(sb[0]||{}).visual},{text:o.cover||o.title||'',pos:'top',big:true,seed:rec.id})}</div>
  <div class="snote"><div class="counts">Слайд 1 из ${n}</div><h2>${esc(o.title||'Сценарий')}</h2><div class="lbl">Идея</div><div>${esc(o.idea||'')}</div>
  <div class="lbl">Хуки на выбор</div><ol class="hk">${(o.hooks||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  <div class="lbl">Референс</div><div>${esc(rec.expert)} · ${fmt(rec.ref_plays)} просм. · ядро «${esc(rec.core||'')}»</div>
  ${o.props?`<div class="lbl">Подготовить</div><div>${esc(o.props)}</div>`:''}</div></div>`;
 if(i===n-1)return `<div class="slide"><div class="skwrap"><div class="fshot">ФИНАЛ</div>${sketchSVG({sk:{plan:'MS',pose:'point_down',emotion:'smile',bg:((sb[sb.length-1]||{}).sk||{}).bg||'plain',cam:'static'}},{text:'Пиши в комментариях',pos:'top',comment:(rec.params||{}).cw||'СЛОВО',seed:rec.id})}</div>
  <div class="snote"><div class="counts">Слайд ${n} из ${n}</div><h2>Публикация</h2><div class="lbl">Подпись к рилсу</div><div class="tr">${esc(o.caption||'')}</div>
  <div class="lbl">Полный текст</div><div class="scr">${(o.script||[]).map(s=>`<p><span class="pill">${esc(s.part||'')}</span> ${esc(s.text||'')}</p>`).join('')}</div></div></div>`;
 const s=sb[i-1];const FF=scFrames(rec).filter(f=>f.si===i-1);return `<div class="slide"><div class="skwrap">${FF[0]?frameSVG(rec,FF[0]):sketchSVG(s)}</div>
  <div class="snote"><div class="counts">Слайд ${i+1} из ${n} · сцена ${esc(String(s.n||i))} · ${esc(s.time||'')}</div>
  <div class="lbl">Что говорю</div><div class="voice">${esc(s.voice||'')}</div>
  <div class="lbl">Что в кадре</div><div>${esc(s.visual||'')}</div>
  <div class="lbl">Титр на экране</div><div><b>${esc(s.onscreen||'—')}</b></div>
  <div class="lbl">Монтаж</div><div>${esc(s.edit||'')}</div>
  <div class="lbl">Кадры сцены (${FF.length} × ${String(FR_SEC).replace('.',',')} с)</div><div class="frs mini">${FF.map(f=>`<div class="fr" onclick="openAnim('${rec.id}',${f.idx})">${frameSVG(rec,f,{lite:true})}</div>`).join('')}</div></div></div>`}
function openSlides(sid){SL={id:sid,i:0};let m=document.getElementById('slm');if(m)m.remove();m=document.createElement('div');m.id='slm';m.className='slmodal';document.body.appendChild(m);drawSlide();document.addEventListener('keydown',slKey)}
function slKey(e){if(!document.getElementById('slm'))return document.removeEventListener('keydown',slKey);if(e.key==='ArrowRight')slGo(1);if(e.key==='ArrowLeft')slGo(-1);if(e.key==='Escape')closeSlides()}
function slGo(d){const rec=scripts[SL.id];const n=(rec.out.storyboard||[]).length+2;SL.i=Math.max(0,Math.min(n-1,SL.i+d));drawSlide()}
function closeSlides(){const m=document.getElementById('slm');if(m)m.remove();document.removeEventListener('keydown',slKey)}
function drawSlide(){const rec=scripts[SL.id];const n=(rec.out.storyboard||[]).length+2;const m=document.getElementById('slm');
 m.innerHTML=`<div class="sltop"><b>${esc(rec.out.title||'Раскадровка')}</b><span><button class="sbtn" onclick="printScript('${rec.id}')">PDF / печать</button> <span class="x" onclick="closeSlides()">✕</span></span></div>
 <div class="slbody">${slideHTML(rec,SL.i)}</div>
 <div class="slnav"><button class="sbtn" onclick="slGo(-1)" ${SL.i===0?'disabled':''}>← Назад</button><span class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===SL.i?'on':''}" onclick="SL.i=${k};drawSlide()"></i>`).join('')}</span><button class="go" onclick="slGo(1)" ${SL.i===n-1?'disabled':''}>Дальше →</button></div>`}
function printScript(sid){const rec=scripts[sid];const n=(rec.out.storyboard||[]).length+2;let p=document.getElementById('printarea');if(!p){p=document.createElement('div');p.id='printarea';document.body.appendChild(p)}
 const FF=scFrames(rec);p.innerHTML=Array.from({length:n},(_,k)=>`<div class="pslide">${slideHTML(rec,k)}</div>`).join('')+`<div class="psheet"><h3>${esc(rec.out.title||'')} — раскадровка, кадр ${String(FR_SEC).replace('.',',')} с (${FF.length} кадров)</h3><div class="frs">${FF.map(f=>`<div class="fr">${frameSVG(rec,f,{lite:true})}${f.sub?`<div class="fra">${esc(f.sub)}</div>`:''}</div>`).join('')}</div></div>`;document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('printing'),500)},100)}

</script></body></html>
