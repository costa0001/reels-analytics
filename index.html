<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аналитика Reels</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6fc;--card:#fff;--ink:#14213d;--mut:#5f6b80;--line:#dde6f1;--acc:#0b2a5b;--accbg:#e3ecf8;--hl:#fff3a8;--warn:#eaf2fc;--warnink:#0b2a5b;--btn:#0b2a5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(241,246,252,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:18px;height:56px}.brand{font-weight:800;letter-spacing:-.02em;font-size:17px}
nav{display:flex;gap:4px}nav a{padding:7px 13px;border-radius:999px;color:var(--mut);text-decoration:none;font-weight:600}
nav a.on{background:var(--btn);color:#fff}
h1{font-size:30px;letter-spacing:-.03em;margin:28px 0 4px;font-weight:800}h2{font-size:20px;margin:30px 0 12px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 18px;max-width:700px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.exp{cursor:pointer;transition:.15s}.exp:hover{border-color:#0b2a5b}
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#dbe7f6 center/cover no-repeat;color:var(--btn);font-weight:700;overflow:hidden;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.avrow{display:flex;align-items:center;gap:10px}
.sbtn{border:1px solid var(--btn);background:#fff;color:var(--btn);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.sbtn:hover{background:#e9f1fb}
.go{background:var(--btn);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.go:disabled{opacity:.5}
.modal{position:fixed;inset:0;background:rgba(11,42,91,.35);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 12px}
.mbox{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.x{cursor:pointer;font-size:18px;color:var(--mut)}
.refbox{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.form label{display:block;font-size:13px;color:var(--mut);margin:8px 0}.form input,.form select{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:inherit;box-sizing:border-box}
.row3{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}.warnbox{background:var(--warn);border:1px solid #c9daf0;border-radius:10px;padding:10px 12px}
.hk li{margin:4px 0}.scr p{margin:6px 0}.sbg{display:grid;gap:10px}.sl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slh{display:flex;gap:10px;align-items:center;background:var(--bg);padding:6px 10px;font-size:13px}.slb{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px;font-size:14px}
.frame{aspect-ratio:9/16;background:#0b2a5b;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:13px;line-height:1.25}
@media(max-width:640px){.row3{grid-template-columns:1fr}.slb{grid-template-columns:90px 1fr}}
.exp h3{margin:0;font-size:17px}.handle{color:var(--mut);font-size:13px}
.stats{display:flex;gap:16px;margin:12px 0 0;flex-wrap:wrap}.stat b{display:block;font-size:17px}.stat span{font-size:11.5px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0}
.box h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.lesson{background:var(--warn);border-color:#c9daf0}
.reel{display:grid;grid-template-columns:46px 1fr;gap:12px}
.rank{font-weight:800;font-size:22px;color:#b7c6dc}.rt{font-weight:700;font-size:16px;margin:0}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:4px 0 8px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#eef2f8;color:#3f4a5e;margin:0 4px 4px 0}
.pill.g{background:var(--accbg);color:var(--acc)}.pill.hot{background:#0b2a5b;color:#fff;font-weight:600}
.hook{background:var(--hl);padding:2px 4px;font-weight:600}
details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:13px;margin-top:6px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:12px 0 2px;font-weight:600}
.tr{font-size:13px;color:#3a4458;background:#f6f9fd;border-radius:8px;padding:10px;max-height:240px;overflow:auto}
a.ext{color:var(--acc);font-size:12.5px;font-weight:600;text-decoration:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.core h3{margin:0 0 4px;font-size:17px}.core p{margin:6px 0}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.btns button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btns button.on.no{background:#7d8aa3;border-color:#7d8aa3}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;min-height:38px;resize:vertical;background:#fbfdff}
.saved{font-size:12px;color:var(--acc);height:16px}
.note{font-size:12.5px;color:var(--mut);margin:30px 0 40px}
.back{color:var(--mut);cursor:pointer;font-weight:600;font-size:13px;margin-top:18px;display:inline-block}
.counts{font-size:13px;color:var(--mut)}
@media(max-width:600px){h1{font-size:24px}.reel{grid-template-columns:1fr}.rank{font-size:16px}}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:#f6f9fd;cursor:pointer;white-space:nowrap}
td .h{color:var(--mut);font-size:12px}.num{white-space:nowrap;font-weight:600}
.done{display:inline-block;white-space:nowrap;background:var(--btn);color:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;text-decoration:none}
input.s{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;min-width:220px}
.flab{font-size:12px;color:var(--mut);align-self:center;margin-right:2px;font-weight:600}
@media(max-width:700px){.hide-m{display:none}}
</style></head><body>
<header><div class="wrap top"><div class="brand">Аналитика Reels</div><nav><a href="#blogery" id="n0">Блогеры</a><a href="#razbory" id="n1">Разборы</a><a href="#yadra" id="n2">Библиотека ядер</a><a href="#scen" id="n3">Сценарии</a></nav></div></header>
<main class="wrap" id="app"></main>

<script>
function av(hd,nm,s){s=s||36;const L=esc(((nm||hd||'?').trim()[0]||'?').toUpperCase());return`<span class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px;background-image:url('avatars/${encodeURIComponent(hd)}.jpg'),url('https://costa0001.github.io/reels-analytics/avatars/${encodeURIComponent(hd)}.jpg')"></span>`}
let D,B,analyzed,bmap;
try{const m=JSON.parse(localStorage.getItem('reels_marks')||'{}');if(m&&typeof m==='object')Object.assign(window,{_lm:m})}catch(e){}
function prep(){
analyzed=new Set(D.experts.map(e=>e.handle.toLowerCase()));
bmap=Object.fromEntries(B.map(b=>[b.handle.toLowerCase(),b]));
D.experts.forEach(e=>{const b=bmap[e.handle.toLowerCase()];e.lang=b?(b.market==='EN'?'en':b.market==='UA'?'ua':'ru'):'en';e.subs_text=b?b.subs_text:''});
D.experts.forEach(e=>{e.median=med(e.reels.map(r=>r.plays));e.reels.forEach(r=>{r.expert=e.name;r.handle=e.handle;r.x=r.plays/e.median;r.cpm=(r.comments||0)/r.plays*1000})});
}




const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' млн':n>=1e3?Math.round(n/1e3)+' тыс':String(n);
const ok=s=>s&&s.trim()&&s.trim()!=='—';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const med=a=>{const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};

let marks=(window._lm||{}),db=null,uid=null,cur={expert:null,filt:'all',lang:'all',verdict:'all'};
const V=[['take','Беру'],['notmine','Ядро, но не моё'],['notcore','Не ядро'],['done','Уже снимал']];
const app=document.getElementById('app');
function route(){const h=location.hash.slice(1)||'blogery';document.getElementById('n0').className=h==='blogery'?'on':'';document.getElementById('n1').className=h==='razbory'||h.startsWith('e-')?'on':'';document.getElementById('n2').className=h==='yadra'?'on':'';document.getElementById('n3').className=h==='scen'?'on':'';
 if(h==='scen')return renderScripts();
 if(h==='yadra')return renderCores(); const m=h.match(/^e-([\w.-]+)/); if(m)return renderExpert(m[1]); if(h==='razbory'){renderHome();return window.scrollTo(0,0)} renderBloggers()}
let bf={lang:'all',subs:'all',q:'',sort:'n'};
const LANG=[['all','Все'],['ru','Русскоязычные'],['ua','Украиноязычные'],['en','Англоязычные']];
const SUBS=[['all','Любое'],['0','до 100 тыс'],['1','100–500 тыс'],['2','500 тыс – 1 млн'],['3','1–5 млн'],['4','5 млн+']];
const subsBand=n=>n==null?-1:n<1e5?0:n<5e5?1:n<1e6?2:n<5e6?3:4;
const langOf=b=>b.market==='EN'?'en':b.market==='UA'?'ua':'ru';
function renderBloggers(){
 let L=B.filter(b=>bf.lang==='all'||langOf(b)===bf.lang).filter(b=>bf.subs==='all'||subsBand(b.subs)===+bf.subs);
 if(bf.q){const q=bf.q.toLowerCase();L=L.filter(b=>(b.name+' '+b.handle+' '+b.niche+' '+b.sells).toLowerCase().includes(q))}
 if(bf.sort==='subs')L=[...L].sort((a,b)=>(b.subs||0)-(a.subs||0));
 const cnt=k=>B.filter(b=>k==='all'||langOf(b)===k).length;
 app.innerHTML=`<h1>Блогеры для анализа</h1><p class="sub">${B.length} аккаунтов: ${cnt('ru')} русскоязычных, ${cnt('ua')} украиноязычных, ${cnt('en')} англоязычных. Зелёная отметка — разбор рилсов уже готов.</p>
 <div class="filters"><span class="flab">Язык:</span>${LANG.map(([k,l])=>`<button class="chip ${bf.lang===k?'on':''}" data-l="${k}">${l} · ${cnt(k)}</button>`).join('')}</div>
 <div class="filters"><span class="flab">Подписчики:</span>${SUBS.map(([k,l])=>`<button class="chip ${bf.subs===k?'on':''}" data-s="${k}">${l}</button>`).join('')}</div>
 <div class="filters"><input class="s" id="q" placeholder="Поиск по имени, нику, нише" value="${esc(bf.q)}"><span class="flab" style="margin-left:8px">Сортировка:</span><button class="chip ${bf.sort==='n'?'on':''}" data-o="n">как в списке</button><button class="chip ${bf.sort==='subs'?'on':''}" data-o="subs">по подписчикам</button><span class="counts" style="align-self:center">Найдено: ${L.length}</span></div>
 <table><thead><tr><th style="width:44px">№</th><th>Блогер</th><th style="width:92px">Подписчики</th><th class="hide-m">Ниша</th><th class="hide-m">Что продаёт</th><th style="width:96px">Разбор</th></tr></thead><tbody>
 ${L.map(b=>{const has=analyzed.has(b.handle.toLowerCase());return`<tr><td class="h">${b.market} ${b.n}</td><td><div class="avrow">${av(b.handle,b.name,38)}<div><b>${esc(b.name)}</b><br><a class="ext" href="${esc(b.url)}" target="_blank" rel="noopener">@${esc(b.handle)}</a> <span class="h">${b.platform!=='Instagram'?esc(b.platform):''}</span></div></div></td><td class="num">${esc(b.subs_text)}</td><td class="hide-m">${esc(b.niche)}<br><span class="h">${b.close==='прямая'?'прямая ниша':'смежная ниша'}</span></td><td class="hide-m h">${esc(b.sells)}</td><td>${has?`<a class="done" href="#e-${esc(b.handle)}">готов →</a>`:'<span class="h">—</span>'}</td></tr>`}).join('')}
 </tbody></table><p class="note">Подписчики — из твоей таблицы (у англоязычных часто диапазон; фильтр берёт нижнюю границу).</p>`;
 app.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{bf.lang=x.dataset.l;renderBloggers()});
 app.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{bf.subs=x.dataset.s;renderBloggers()});
 app.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{bf.sort=x.dataset.o;renderBloggers()});
 const q=document.getElementById('q');q.oninput=()=>{bf.q=q.value;const p=q.selectionStart;renderBloggers();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
}
function card(e){{const top=[...e.reels].sort((a,b)=>b.plays-a.plays)[0];const hits=e.reels.filter(r=>r.x>=2).length;return`<div class="card exp" onclick="location.hash='e-${e.handle}'"><div class="avrow">${av(e.handle,e.name,52)}<div><h3>${esc(e.name)}</h3><div class="handle">@${e.handle} · ${esc(e.subs_text)} подп. · ${esc(e.sample)}</div></div></div><p style="margin:10px 0 0;font-size:13.5px">${esc(e.about)}</p><div class="stats"><div class="stat"><b>${fmt(e.median)}</b><span>медиана просмотров</span></div><div class="stat"><b>${hits} из ${e.reels.length}</b><span>залётов (×2 к медиане)</span></div><div class="stat"><b>${fmt(top.plays)}</b><span>лучший рилс</span></div></div></div>`}}
function renderHome(){const g=(l,t)=>{const L=D.experts.filter(e=>e.lang===l);return L.length?`<h2>${t} · ${L.length}</h2><div class="grid">${L.map(card).join('')}</div>`:''};app.innerHTML=`<h1>Разборы</h1><p class="sub">Эксперты, их рилсы в Instagram и разбор: что залетает, почему и какое ядро можно забрать себе.</p>${g('ru','Русскоязычные')}${g('ua','Украиноязычные')}${g('en','Англоязычные')}<p class="note">Цифры — публичные данные Instagram на 20.11.2026. «×» — во сколько раз рилс выше медианы выборки (у топ-10 сравнение внутри десятки). Тексты расшифрованы из звука автоматически, возможны неточности.</p>`}
function reelCard(r,i){const hot=r.x>=2?`<span class="pill hot">×${r.x.toFixed(1)} к медиане</span>`:`<span class="pill">×${r.x.toFixed(1)}</span>`;
 return`<div class="box reel"><div class="rank">№${i+1}</div><div><p class="rt">${esc(r.title)}</p><div class="meta"><span><b>${fmt(r.plays)}</b> просм.</span><span>${r.likes<50&&r.plays>1e5?'лайки скрыты':fmt(r.likes)+' лайков'}</span><span>${fmt(r.comments||0)} комм.</span><span>${r.dur} с</span><span>${r.date}</span></div>${hot}<span class="pill">${esc(r.format)}</span>${r.tags.map(t=>`<span class="pill g">${esc(t)}</span>`).join('')}
 <div class="lbl">Хук</div><div><span class="hook">${esc(r.hook_ru)}</span></div>${r.hook_en?`<div style="font-size:12.5px;color:var(--mut);margin-top:3px">Оригинал: «${esc(r.hook_en)}»</div>`:''}
 <details><summary>Разбор и текст</summary>${ok(r.structure)?`<div class="lbl">Структура</div><div>${esc(r.structure)}</div>`:''}${ok(r.why)?`<div class="lbl">Почему сработало (или нет)</div><div>${esc(r.why)}</div>`:''}${ok(r.core)?`<div class="lbl">Ядро</div><div><b>${esc(r.core)}.</b> ${ok(r.core_text)?esc(r.core_text):''}</div>`:''}${ok(r.adapt)?`<div class="lbl">Как забрать себе</div><div style="background:var(--warn);padding:8px 10px;border-radius:8px;border:1px solid #c9daf0">${esc(r.adapt)}</div>`:''}${r.caption?`<div class="lbl">Подпись</div><div class="tr">${esc(r.caption)}</div>`:''}${r.transcript?`<div class="lbl">Текст рилса (расшифровка начала)</div><div class="tr">${esc(r.transcript)}</div>`:''}</details>
 <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a class="ext" href="${r.url}" target="_blank" rel="noopener">Открыть в Instagram →</a>${scriptBtn(r)}</div></div></div>`}
function renderExpert(h){const e=D.experts.find(x=>x.handle===h);if(!e)return renderHome();const rs=[...e.reels].sort((a,b)=>b.plays-a.plays);
 app.innerHTML=`<span class="back" onclick="location.hash='razbory'">← Все разборы</span><div class="avrow" style="margin-top:8px">${av(e.handle,e.name,72)}<div><h1 style="margin:0">${esc(e.name)}</h1><p class="sub" style="margin:4px 0 0">@${e.handle} · ${esc(e.sample)}</p></div></div>
 <div class="box"><h4>Кто это</h4>${esc(e.about)}</div><div class="box"><h4>Что продаёт и как</h4>${esc(e.sells)}</div><div class="box"><h4>Формула залётов</h4>${esc(e.formula)}</div><div class="box lesson"><h4>Что это значит для тебя</h4>${esc(e.lesson)}</div>
 <h2>Рилсы — от лучшего к слабому</h2>${rs.map(reelCard).join('')}`;window.scrollTo(0,0)}
function verdictOf(id){return marks[id]?.verdict||''}
function renderCores(){const all=D.experts.flatMap(e=>e.reels).filter(r=>ok(r.core)&&ok(r.core_text));
 const langOfR=r=>(D.experts.find(e=>e.handle===r.handle)||{}).lang;
 let list=all.filter(r=>cur.lang==='all'||langOfR(r)===cur.lang).filter(r=>cur.filt==='all'||r.handle===cur.filt).filter(r=>cur.verdict==='all'?true:cur.verdict==='new'?!verdictOf(r.id):verdictOf(r.id)===cur.verdict).sort((a,b)=>b.x-a.x);
 const cnt=k=>all.filter(r=>k==='new'?!verdictOf(r.id):verdictOf(r.id)===k).length;
 app.innerHTML=`<h1>Библиотека ядер</h1><p class="sub">Ядро — смысл, который можно рассказать своими словами и своей историей. Отметь, что берёшь: по ядрам с отметкой «Беру» я буду писать сценарии и раскадровки. Комментарии сохраняются, я их читаю.</p>
 <div class="filters"><span class="flab">Язык:</span>${[['all','Все'],['ru','Русскоязычные'],['en','Англоязычные']].map(([k,l])=>`<button class="chip ${cur.lang===k?'on':''}" data-lg="${k}">${l}</button>`).join('')}<span class="flab" style="margin-left:8px">Эксперт:</span><select id="exsel" class="s" style="border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:inherit;font-size:13px;background:#fff"><option value="all">Все эксперты</option>${D.experts.filter(e=>cur.lang==='all'||e.lang===cur.lang).map(e=>`<option value="${e.handle}" ${cur.filt===e.handle?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
 <div class="filters">${[['all','Все',all.length],['new','Новые',cnt('new')],...V.map(([k,l])=>[k,l,cnt(k)])].map(([k,l,c])=>`<button class="chip ${cur.verdict===k?'on':''}" data-v="${k}">${l} · ${c}</button>`).join('')}</div>
 ${db?'':'<p class="counts">Отметки сохраняются в вашем браузере.</p>'}
 ${list.map(r=>{const v=verdictOf(r.id);return`<div class="box core"><h3>${esc(r.core)}</h3><span class="pill g" style="display:inline-flex;align-items:center;gap:6px;padding-left:3px">${av(r.handle,r.expert,22)}${esc(r.expert)}</span><span class="pill ${r.x>=2?'hot':''}">${fmt(r.plays)} · ×${r.x.toFixed(1)}</span>${r.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}
 <p>${esc(r.core_text)}</p><p style="font-size:13px"><span style="color:var(--mut)">Как забрать себе:</span> ${esc(r.adapt)}</p><p style="font-size:13px"><span style="color:var(--mut)">Откуда:</span> «${esc(r.title)}» — <a class="ext" href="${r.url}" target="_blank" rel="noopener">рилс</a></p><div style="margin:6px 0">${scriptBtn(r)}</div>
 <div class="btns">${V.map(([k,l])=>`<button data-id="${r.id}" data-k="${k}" class="${v===k?'on'+(k==='take'?'':' no'):''}">${l}</button>`).join('')}</div>
 <textarea data-c="${r.id}" placeholder="Комментарий, если есть (например: своя история — про первый заработок на ботах)">${esc(marks[r.id]?.comment||'')}</textarea><div class="saved" id="s-${r.id}"></div></div>`}).join('')||'<p class="counts">Здесь пока пусто.</p>'}
 <p class="note">Ядра собраны из разобранных рилсов. Источник цифр — Instagram, 20.11.2026.</p>`;
 app.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{cur.lang=b.dataset.lg;cur.filt='all';renderCores()});
 const xs=document.getElementById('exsel');xs.onchange=()=>{cur.filt=xs.value;renderCores()};
 app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{cur.verdict=b.dataset.v;renderCores()});
 app.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{const id=b.dataset.id,k=b.dataset.k;const v=verdictOf(id)===k?'':k;save(id,{verdict:v});const y=scrollY;renderCores();scrollTo(0,y)});
 app.querySelectorAll('textarea').forEach(t=>{let tm;t.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>save(t.dataset.c,{comment:t.value}),700)}})}
async function save(id,patch){marks[id]={...(marks[id]||{}),...patch,updated:new Date().toISOString()};const s=document.getElementById('s-'+id);
 if(!db){try{localStorage.setItem('reels_marks',JSON.stringify(marks));if(s){s.textContent='Сохранено в этом браузере';setTimeout(()=>s.textContent='',1500)}}catch(e){if(s)s.textContent='Не удалось сохранить'}return}
 try{const r=D.experts.flatMap(e=>e.reels).find(x=>x.id===id);await db.collection('marks').doc(id).set({...marks[id],core:r.core,expert:r.expert});if(s){s.textContent='Сохранено';setTimeout(()=>s.textContent='',1500)}}catch(e){if(s)s.textContent='Не удалось сохранить'}}
window.addEventListener('hashchange',route);
app.innerHTML='<p class="sub" style="margin-top:30px">Загружаю базу…</p>';
Promise.all([fetch('data.json').then(r=>r.json()),fetch('bloggers.json').then(r=>r.json())]).then(([d,b])=>{D=d;B=b;prep();route();}).catch(e=>{app.innerHTML='<p class="sub">Не удалось загрузить данные. Обновите страницу.</p>'});
(async()=>{try{const c=window.claude;if(!c)return;db=await c.use('db');if(!db)return;
 const snap=await db.collection('marks').get();(snap.docs||snap||[]).forEach(d=>{const data=d.data?d.data():d;const id=d.id||data.id;if(id)marks[id]=data});
 if(D&&(location.hash.slice(1))==='yadra')renderCores()}catch(e){console.log('db',e)}})();
// ===== Сценарии и раскадровки (генерация через Claude) =====
let SC=null, scripts={}, scPrefs={};
try{scPrefs=JSON.parse(localStorage.getItem('scr_prefs')||'{}')}catch(e){}
try{Object.assign(scripts,JSON.parse(localStorage.getItem('scr_local')||'{}'))}catch(e){}
(async()=>{try{const c=window.claude;if(!c)return;SC=await c.use('sample');document.body.classList.toggle('has-sc',!!SC)}catch(e){}})();
(async()=>{try{const c=window.claude;if(!c)return;const d=await c.use('db');if(!d)return;const snap=await d.collection('scripts').get();(snap.docs||snap||[]).forEach(x=>{const v=x.data?x.data():x;const id=x.id||v.id;if(id)scripts[id]=v});if(location.hash==='#scen')renderScripts()}catch(e){console.log('scripts',e)}})();
function reelById(id){for(const e of D.experts)for(const r of e.reels)if(r.id===id)return [r,e];return [null,null]}
function scriptBtn(r){return `<button class="sbtn" onclick="event.stopPropagation();openScript('${r.id}')">✍️ Сценарий и раскадровка</button>`}
function closeModal(){const m=document.getElementById('scm');if(m)m.remove();document.body.style.overflow=''}
function openScript(id){const [r,e]=reelById(id);if(!r)return;closeModal();document.body.style.overflow='hidden';
 const m=document.createElement('div');m.id='scm';m.className='modal';m.onclick=ev=>{if(ev.target===m)closeModal()};
 m.innerHTML=`<div class="mbox"><div class="mhead"><b>Новый сценарий по ядру</b><span class="x" onclick="closeModal()">✕</span></div>
 <div class="refbox"><div class="lbl" style="margin-top:0">Референс</div><div>${av(e.handle,e.name,28)} <b>${esc(e.name)}</b> · ${fmt(r.plays)} просм. · <a class="ext" href="${r.url}" target="_blank" rel="noopener">открыть</a></div>
 <div style="margin-top:6px"><span class="hook">${esc(r.hook_ru)}</span></div>${ok(r.core)?`<div style="margin-top:6px"><b>Ядро:</b> ${esc(r.core)}${ok(r.core_text)?' — '+esc(r.core_text):''}</div>`:''}</div>
 ${SC?`<div class="form">
  <label>Твоя тема / ниша<input id="sc_topic" value="${esc(scPrefs.topic||'')}" placeholder="Например: ИИ-агенты для экспертов и малого бизнеса"></label>
  <label>Что продаёшь / куда ведёшь<input id="sc_offer" value="${esc(scPrefs.offer||'')}" placeholder="Например: клуб, консультация, гайд"></label>
  <div class="row3"><label>Кодовое слово<input id="sc_cw" value="${esc(scPrefs.cw||'')}" placeholder="АГЕНТ"></label>
  <label>Длительность<select id="sc_dur">${[30,45,60,90].map(s=>`<option ${String(scPrefs.dur||45)==String(s)?'selected':''}>${s}</option>`).join('')}</select></label>
  <label>Подача<select id="sc_tone">${['как у референса','дерзко и провокационно','спокойно-экспертно','с юмором','история от первого лица'].map(s=>`<option ${scPrefs.tone===s?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <label>Пожелания (необязательно)<input id="sc_note" value="" placeholder="Например: снимаю один, без помощника; есть скринкасты"></label>
  <button class="go" id="sc_go" onclick="genScript('${id}')">Написать сценарий и раскадровку</button><div id="sc_st" class="counts"></div></div>`
 :`<div class="warnbox">Генерация сценариев работает в версии приложения внутри Claude: <a class="ext" href="https://claude.ai/artifact/3wwrJ4ScoVagn9FBgLNH6e" target="_blank" rel="noopener">открыть её</a>. Здесь можно смотреть уже готовые сценарии во вкладке «Сценарии».</div>`}
 <div id="sc_out"></div></div>`;
 document.body.appendChild(m)}
function scPrompt(r,e,p){return `Ты — сценарист коротких вертикальных видео (Instagram Reels) и монтажёр. Пиши по-русски.
ЗАДАЧА: на основе вирусного ролика-референса создать НОВЫЙ оригинальный сценарий для автора, сохранив смысловое ядро (почему ролик сработал), но в его теме. Не копируй текст референса дословно — перенеси механику.

РЕФЕРЕНС
Автор: ${e.name} (@${e.handle}); просмотры: ${r.plays}; комментарии: ${r.comments||0}; длительность: ${r.dur} c
Формат: ${r.format}
Хук: ${r.hook_ru}
${ok(r.core)?'Ядро: '+r.core+(ok(r.core_text)?' — '+r.core_text:''):''}
${ok(r.why)?'Почему сработал: '+r.why:''}
${ok(r.adapt)?'Подсказка по адаптации: '+r.adapt:''}
${r.transcript?'Текст ролика (начало, автоматическая расшифровка, могут быть ошибки): '+r.transcript.slice(0,1500):''}
${r.caption?'Подпись: '+r.caption.slice(0,600):''}

АВТОР НОВОГО РОЛИКА
Тема/ниша: ${p.topic||'не указана — выбери близкую к референсу'}
Что продаёт / куда ведёт: ${p.offer||'не указано'}
Кодовое слово для комментариев: ${p.cw||'придумай короткое'}
Длительность: ${p.dur} секунд
Подача: ${p.tone}
Пожелания: ${p.note||'нет'}

ТРЕБОВАНИЯ
- Первые 1–3 секунды — сильный хук (боль, интрига, цифра или провокация), понятный без звука по титру.
- Говорить простым разговорным языком, короткими фразами, без воды.
- Одна мысль — один кадр. Темп и длина должны укладываться в ${p.dur} c (≈2,3 слова в секунду речи).
- Финал — призыв написать кодовое слово в комментарии и что человек получит.
- Раскадровка — по сценам (слайдам), с таймкодами, планом, тем, что в кадре, текстом речи, титром на экране и монтажным приёмом.

ВЕРНИ ТОЛЬКО JSON без пояснений, строго такой структуры:
{"title":"рабочее название ролика","idea":"1–2 предложения: какое ядро берём из референса и как переносим","hooks":["вариант хука 1","вариант хука 2","вариант хука 3"],"script":[{"part":"Хук|Боль|Поворот|Польза|Доказательство|Призыв и т.п.","text":"дословно, что говорит автор"}],"storyboard":[{"n":1,"time":"0–3 с","shot":"крупный / средний / экран / B-roll / титр","visual":"что в кадре и что делает автор","voice":"текст за кадром или в кадре","onscreen":"текст на экране","edit":"монтаж: зум, склейка, звук, переход"}],"cover":"текст обложки (до 6 слов)","caption":"подпись к рилсу 2–4 предложения с призывом","props":"что подготовить к съёмке (одной строкой)"}`}
async function genScript(id){const [r,e]=reelById(id);const g=k=>document.getElementById(k).value.trim();
 const p={topic:g('sc_topic'),offer:g('sc_offer'),cw:g('sc_cw'),dur:g('sc_dur'),tone:g('sc_tone'),note:g('sc_note')};
 scPrefs={...scPrefs,topic:p.topic,offer:p.offer,cw:p.cw,dur:p.dur,tone:p.tone};try{localStorage.setItem('scr_prefs',JSON.stringify(scPrefs))}catch(e){}
 const b=document.getElementById('sc_go'),st=document.getElementById('sc_st');b.disabled=true;st.textContent='Пишу сценарий и раскадровку… обычно 30–60 секунд';
 try{const out=await SC.json(scPrompt(r,e,p),{modelTier:'complex'});
  if(!out||!out.storyboard)throw {message:'пустой ответ'};
  const sid=id+'-'+Date.now();const rec={id:sid,reel:id,expert:e.name,handle:e.handle,ref_hook:r.hook_ru,ref_plays:r.plays,ref_url:r.url,core:r.core,params:p,out,created:new Date().toISOString()};
  scripts[sid]=rec;st.textContent='';document.getElementById('sc_out').innerHTML=scriptView(rec,true)}
 catch(err){st.textContent=err&&err.code==='rate_limited'?'Слишком много запросов — попробуйте через минуту.':err&&err.code==='not_granted'?'Нужно разрешить приложению обращаться к Claude.':'Не получилось: '+(err&&err.message||'ошибка')+'. Попробуйте ещё раз.'}
 finally{b.disabled=false}}
async function saveScript(sid){const rec=scripts[sid];const s=document.getElementById('sv-'+sid);
 try{const c=window.claude;const d=c&&await c.use('db');if(!d)throw 0;await d.collection('scripts').doc(sid).set(rec);if(s)s.textContent='Сохранено — видно всем, у кого есть ссылка'}
 catch(e){try{const loc=JSON.parse(localStorage.getItem('scr_local')||'{}');loc[sid]=rec;localStorage.setItem('scr_local',JSON.stringify(loc));if(s)s.textContent='Сохранено в этом браузере'}catch(e2){if(s)s.textContent='Не удалось сохранить'}}}
async function delScript(sid){if(!confirm('Удалить сценарий?'))return;delete scripts[sid];try{const c=window.claude;const d=c&&await c.use('db');if(d)await d.collection('scripts').doc(sid).delete()}catch(e){}try{const loc=JSON.parse(localStorage.getItem('scr_local')||'{}');delete loc[sid];localStorage.setItem('scr_local',JSON.stringify(loc))}catch(e){}renderScripts()}
function scriptView(rec,fresh){const o=rec.out||{};const sb=o.storyboard||[];
 return `<div class="scv"><h2 style="margin:6px 0 2px">${esc(o.title||'Сценарий')}</h2><div class="counts">по ядру «${esc(rec.core||'')}» · референс: ${esc(rec.expert)} (${fmt(rec.ref_plays)} просм.) · ${esc((rec.params||{}).dur||'')} с</div>
 ${o.idea?`<div class="lbl">Что берём из референса</div><div>${esc(o.idea)}</div>`:''}
 ${(o.hooks||[]).length?`<div class="lbl">Варианты хука</div><ol class="hk">${o.hooks.map(h=>`<li>${esc(h)}</li>`).join('')}</ol>`:''}
 ${(o.script||[]).length?`<div class="lbl">Сценарий (текст)</div><div class="scr">${o.script.map(s=>`<p><span class="pill">${esc(s.part||'')}</span> ${esc(s.text||'')}</p>`).join('')}</div>`:''}
 <div class="lbl">Раскадровка по сценам</div><div class="sbg">${sb.map(s=>`<div class="sl"><div class="slh"><b>Сцена ${esc(String(s.n||''))}</b><span>${esc(s.time||'')}</span><span class="pill">${esc(s.shot||'')}</span></div>
  <div class="slb"><div class="frame">${esc(s.onscreen||'')}</div><div><div><b>В кадре:</b> ${esc(s.visual||'')}</div><div><b>Текст:</b> ${esc(s.voice||'')}</div><div><b>Монтаж:</b> ${esc(s.edit||'')}</div></div></div></div>`).join('')}</div>
 ${o.cover?`<div class="lbl">Обложка</div><div><b>${esc(o.cover)}</b></div>`:''}${o.caption?`<div class="lbl">Подпись</div><div class="tr">${esc(o.caption)}</div>`:''}${o.props?`<div class="lbl">Подготовить к съёмке</div><div>${esc(o.props)}</div>`:''}
 <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${fresh?`<button class="go" onclick="saveScript('${rec.id}')">Сохранить</button>`:`<button class="sbtn" onclick="delScript('${rec.id}')">Удалить</button>`}<button class="sbtn" onclick="copyScript('${rec.id}')">Скопировать текстом</button><span class="counts" id="sv-${rec.id}"></span></div></div>`}
function copyScript(sid){const o=scripts[sid].out;const t=[o.title,'',...(o.hooks||[]).map((h,i)=>`Хук ${i+1}: ${h}`),'',...(o.script||[]).map(s=>`[${s.part}] ${s.text}`),'','РАСКАДРОВКА',...(o.storyboard||[]).map(s=>`Сцена ${s.n} (${s.time}, ${s.shot})\nВ кадре: ${s.visual}\nТекст: ${s.voice}\nТитр: ${s.onscreen}\nМонтаж: ${s.edit}`),'','Обложка: '+(o.cover||''),'Подпись: '+(o.caption||'')].join('\n');
 navigator.clipboard.writeText(t).then(()=>{const s=document.getElementById('sv-'+sid);if(s)s.textContent='Скопировано'})}
function renderScripts(){const L=Object.values(scripts).sort((a,b)=>String(b.created).localeCompare(String(a.created)));
 app.innerHTML=`<h1>Сценарии и раскадровки</h1><p class="sub">Сценарии, написанные по ядрам вирусных роликов. Новый сценарий — кнопка «✍️ Сценарий и раскадровка» у любого ролика в «Разборах» или «Библиотеке ядер».</p>
 ${L.length?L.map(r=>`<details class="box" style="display:block"><summary><b>${esc((r.out||{}).title||'Сценарий')}</b> <span class="counts">· ${esc(r.expert)} · ${new Date(r.created).toLocaleDateString('ru')}</span></summary>${scriptView(r,false)}</details>`).join(''):'<p class="counts">Пока нет сохранённых сценариев.</p>'}`}

</script></body></html>
